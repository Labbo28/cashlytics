<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<!-- Font import from Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,700&display=swap" rel="stylesheet">
	<!-- Font Awesome for icons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>

<body>
	<div th:fragment="siteHeader">
		<header class="homepage-header">

			<!-- Sezione sinistra: logo/navigazione -->
			<div class="container">
				<nav class="main-nav">
					<a th:href="@{/}" class="logo">CashLytics</a>
					<ul class="nav-links">

						<!-- Sezione destra: se l'utente ha effettuato il login -->
						<li th:if="${userDetails}">
							<a th:href="${'/'+userDetails.username+'/dashboard'}" class="nav-btn"
								th:text="${userDetails.username}">utente</a>
						</li>
						<li th:if="${userDetails}">
							<form class="inline-form" th:action="@{/logout}" method="post">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
								<button class="nav-btn nav-btn-primary" type="submit">Logout</button>
							</form>
						</li>

						<!-- Se l'utente NON ha effettuato il login -->
						<li th:unless="${userDetails}">
							<a th:href="@{/login}" class="nav-btn">Accedi</a>
						</li>
						<li th:unless="${userDetails}">
							<a th:href="@{/register}" class="nav-btn nav-btn-primary">Registrati</a>
						</li>
					</ul>
				</nav>
			</div>
		</header>
	</div>

	<div th:fragment="siteFooter">
		<footer class="main-footer">
			<div class="container">
				<p>2025 CashLytics - Progetto universitario</p>
			</div>
		</footer>
	</div>

	<div th:fragment="newMerchantForm">
		<div id="newMerchantForm"
			style="display: none; margin-top: 1rem; margin-bottom: 1rem; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); background-color: var(--neutral-light);">
			<h4 style="margin-bottom: 1rem; color: var(--primary);">Crea nuovo esercente</h4>
			<div class="form-group">
				<label for="merchantName">Nome esercente</label>
				<input type="text" id="merchantName" th:field="*{merchantName}" />
				<span class="error" th:if="${#fields.hasErrors('merchantName')}" th:errors="*{merchantName}"></span>
			</div>
			<div style="display: flex; gap: 1rem; margin-top: 1rem;">
				<button type="button" class="btn btn-secondary" onclick="cancelNewMerchant()">
					Annulla
				</button>
			</div>
		</div>
	</div>

	<div th:fragment="newCategoryForm">
		<div id="newCategoryForm"
			style="display: none; margin-top: 1rem; margin-bottom: 1rem; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); background-color: var(--neutral-light);">
			<h4 style="margin-bottom: 1rem; color: var(--primary);">Crea nuova categoria</h4>

			<div class="form-group">
				<label for="categoryName">Nome categoria</label>
				<input type="text" id="categoryName" th:field="*{categoryName}" />
				<span class="error" th:if="${#fields.hasErrors('categoryName')}" th:errors="*{categoryName}"></span>
			</div>

			<div class="form-group">
				<label for="categoryIcon">Icona</label>
				<div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 0.5rem;">
					<label class="icon-option" for="icon-shopping">
						<input type="radio" id="icon-shopping" name="icon" value="fas fa-shopping-cart"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-shopping-cart"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-food">
						<input type="radio" id="icon-food" name="icon" value="fas fa-utensils"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-utensils"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-transport">
						<input type="radio" id="icon-transport" name="icon" value="fas fa-car"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-car"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-entertainment">
						<input type="radio" id="icon-entertainment" name="icon" value="fas fa-gamepad"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-gamepad"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-health">
						<input type="radio" id="icon-health" name="icon" value="fas fa-heartbeat"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-heartbeat"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-home">
						<input type="radio" id="icon-home" name="icon" value="fas fa-home" th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-home"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-education">
						<input type="radio" id="icon-education" name="icon" value="fas fa-graduation-cap"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-graduation-cap"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-travel">
						<input type="radio" id="icon-travel" name="icon" value="fas fa-plane"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-plane"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-bills">
						<input type="radio" id="icon-bills" name="icon" value="fas fa-receipt"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-receipt"></i>
						</div>
					</label>
					<label class="icon-option" for="icon-salary">
						<input type="radio" id="icon-salary" name="icon" value="fas fa-euro-sign"
							th:field="*{categoryIcon}" />
						<div class="icon-preview">
							<i class="fas fa-euro-sign"></i>
						</div>
					</label>
				</div>
				<span class="error" th:if="${#fields.hasErrors('categoryIcon')}" th:errors="*{categoryIcon}"></span>
			</div>

			<div class="form-group">
				<label for="categoryColor">Colore</label>
				<div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 0.5rem;">
					<label class="color-option" for="color-red">
						<input type="radio" id="color-red" name="color" value="#E53E3E" th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #E53E3E;"></div>
					</label>
					<label class="color-option" for="color-orange">
						<input type="radio" id="color-orange" name="color" value="#FF8C00"
							th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #FF8C00;"></div>
					</label>
					<label class="color-option" for="color-yellow">
						<input type="radio" id="color-yellow" name="color" value="#FFD700"
							th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #FFD700;"></div>
					</label>
					<label class="color-option" for="color-green">
						<input type="radio" id="color-green" name="color" value="#90EE90" th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #90EE90;"></div>
					</label>
					<label class="color-option" for="color-blue">
						<input type="radio" id="color-blue" name="color" value="#4DABFF" th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: var(--primary-light);"></div>
					</label>
					<label class="color-option" for="color-indigo">
						<input type="radio" id="color-indigo" name="color" value="#5A67D8"
							th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #5A67D8;"></div>
					</label>
					<label class="color-option" for="color-purple">
						<input type="radio" id="color-purple" name="color" value="#805AD5"
							th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #805AD5;"></div>
					</label>
					<label class="color-option" for="color-pink">
						<input type="radio" id="color-pink" name="color" value="#D53F8C" th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #D53F8C;"></div>
					</label>
					<label class="color-option" for="color-teal">
						<input type="radio" id="color-teal" name="color" value="#319795" th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #319795;"></div>
					</label>
					<label class="color-option" for="color-gray">
						<input type="radio" id="color-gray" name="color" value="#718096" th:field="*{categoryColor}" />
						<div class="color-preview" style="background-color: #718096;"></div>
					</label>
				</div>
				<span class="error" th:if="${#fields.hasErrors('categoryColor')}" th:errors="*{categoryColor}"></span>
			</div>

			<div style="display: flex; gap: 1rem; margin-top: 1rem;">
				<button type="button" class="btn btn-secondary" onclick="cancelNewCategory()">
					Annulla
				</button>
			</div>
		</div>
	</div>

	<div th:fragment="allTransactionsList(transactions)">
		<div th:unless="${transactions == null or #lists.isEmpty(transactions)}" class="features-grid"
			style="text-align: center;">
			<div th:each="trans : ${transactions}" class="feature-card" style="position: relative;">

				<div style="display: flex; align-items: center; justify-content: center;">
					<h3 style="font-size: 1.3rem; font-weight: 600;"
						th:style="${trans.amount >= 0} ? 'color: var(--accent);' : 'color: var(--warning);'">
						<span style="margin-right: 0.9rem;"
							th:text="${trans.amount < 0 ? '-€' + #numbers.formatDecimal(trans.amount.abs(), 1, 2) : '€' + #numbers.formatDecimal(trans.amount, 1, 2)}">
							€0.00</span>
					</h3>

					<!-- Mostra category se presente -->
					<div th:if="${trans.category != null}"
						style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.95rem;">
						<!-- Icona categoria principale (se la categoria corrente è una sottocategoria) -->
						<div th:if="${trans.category.parentCategory != null}" class="category-badge"
							th:title="${'Categoria principale: ' + trans.category.parentCategory.name}"
							th:style="'background-color: ' + ${trans.category.parentCategory.color} + '; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; opacity: 0.8;'">
							<i th:class="${trans.category.parentCategory.icon}"></i>
						</div>
						<!-- Icona categoria corrente (principale o sottocategoria) -->
						<div class="category-badge" th:title="${trans.category.name}"
							th:style="'background-color: ' + ${trans.category.color} + '; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; opacity: 0.8;'">
							<i th:class="${trans.category.icon}"></i>
						</div>
					</div>

				</div>
				<h3 th:text="${trans.description}" style="margin-bottom: 0.25rem;">Transazione</h3>
				<!-- Mostra merchant se presente -->
				<p th:if="${trans.merchant != null}"
					style="margin-bottom: 0.25rem; font-style: italic; color: var(--neutral-dark);">
					<i class="fas fa-store"></i> <span th:text="${trans.merchant.name}">Merchant</span>
				</p>
				<p><span th:text="${#temporals.format(trans.date, 'dd/MM/yyyy')}">01/01/2025</span>

					<!-- Badge per tipo ricorrenza -->
				<div th:unless="${trans.recurrence.name() == 'UNA_TANTUM'}"
					style="position: absolute; top: 1rem; left: 1rem;">
					<span
						style="background: var(--primary); color: white; padding: 0.25rem 0.5rem; border-radius: 1rem; font-size: 0.8rem;">
						<i class="fas fa-sync-alt"></i> <span th:text="${trans.recurrence}">Ricorrente</span>
					</span></p>
				</div>

				<!-- Menu a tendina per la transazione -->
				<div class="menu-wrapper" style="position: absolute; top: 1.5rem; right: 1.25rem;">
					<button class="menu-button" onclick="toggleMenu(this)"
						style="background: none; border: none; cursor: pointer; min-width: 30px; min-height: 30px;">
						<i class="fas fa-ellipsis-v" style="font-size: 1.25rem;"></i>
					</button>

					<!-- Menu dropdown -->
					<div class="menu-dropdown"
						style="display: none; position: absolute; top: 2rem; right: 0; background: white; border: 1px solid var(--neutral-light); border-radius: 0.5rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); z-index: 10;">
						<!-- Modifica -->
						<a th:href="@{'/' + ${username} + '/account/' + ${account.id} + '/edit-transaction/' + ${trans.id}}"
							class="menu-item"
							style="display: block; padding: 0.75rem 1rem; text-decoration: none; color: var(--primary);">
							<i class="fas fa-edit"></i> Modifica
						</a>
						<!-- Elimina -->
						<form method="post" style="margin: 0;"
							onsubmit="return confirm('Eliminare questa transazione?');"
							th:action="@{'/' + ${username} + '/account/' + ${account.id} + '/delete-transaction/' + ${trans.id}}">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<button type="submit"
								style="background: none; border: none; padding: 0.75rem 1rem; width: 100%; text-align: left; cursor: pointer; color: red;">
								<i class="fas fa-trash-alt"></i> Elimina
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div th:fragment="allBudgetsList(budgets)">
		<div th:unless="${budgets == null or #lists.isEmpty(budgets)}" class="features-grid"
			style="text-align: center;">
			<div th:each="b : ${budgets}" class="feature-card" style="position: relative;">

				<div style="display: flex; align-items: center; justify-content: center;">
					<!-- Importo -->
					<h3 style="font-size: 1.3rem; font-weight: 600; margin-right: 0.9rem;"
						th:style="${b.amount >= 0} ? 'color: var(--accent);' : 'color: var(--warning);'">
						<span style="margin-right: 0.9rem;"
							th:text="${b.amount < 0 ? '-€' + #numbers.formatDecimal(b.amount.abs(),1,2) : '€' + #numbers.formatDecimal(b.amount,1,2)}">
							€0.00</span>
					</h3>

					<!-- Mostra category se presente -->
					<div th:if="${b.category != null}"
						style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.95rem;">
						<!-- Icona categoria principale (se la categoria corrente è una sottocategoria) -->
						<div th:if="${b.category.parentCategory != null}" class="category-badge"
							th:title="${'Categoria principale: ' + b.category.parentCategory.name}"
							th:style="'background-color: ' + ${b.category.parentCategory.color} + '; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; opacity: 0.8;'">
							<i th:class="${b.category.parentCategory.icon}"></i>
						</div>
						<!-- Icona categoria corrente (principale o sottocategoria) -->
						<div class="category-badge" th:title="${b.category.name}"
							th:style="'background-color: ' + ${b.category.color} + '; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; opacity: 0.8;'">
							<i th:class="${b.category.icon}"></i>
						</div>
					</div>

					<!-- Descrizione -->
				</div>
				<h3 th:text="${b.description}" style="margin-bottom: 0.25rem;">Budget</h3>
				<p><span th:text="${#temporals.format(b.date,'dd/MM/yyyy')}">01/01/2025</span>

					<!-- Badge Ricorrenza -->
				<div th:if="${b.recurrence != null and b.recurrence.name() != 'UNA_TANTUM'}"
					style="position: absolute; top: 1rem; left: 1rem;">
					<span
						style="background: var(--primary); color: white; padding: 0.25rem 0.5rem; border-radius: 1rem; font-size: 0.8rem;">
						<i class="fas fa-sync-alt"></i> <span th:text="${b.recurrence}">Ricorrente</span>
					</span></p>
				</div>

				<!-- Menu a tendina -->
				<div class="menu-wrapper" style="position: absolute; top: 1.5rem; right: 1.25rem;">
					<button class="menu-button" onclick="toggleMenu(this)"
						style="background: none; border: none; cursor: pointer; min-width: 30px; min-height: 30px;">
						<i class="fas fa-ellipsis-v" style="font-size: 1.25rem;"></i>
					</button>

					<div class="menu-dropdown"
						style="display: none; position: absolute; top: 2rem; right: 0; background: white; border: 1px solid var(--neutral-light); border-radius: 0.5rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); z-index: 10;">
						<!-- Modifica -->
						<a th:href="@{'/' + ${username} + '/account/' + ${account.id} + '/edit-budget/' + ${b.id}}"
							class="menu-item"
							style="display: block; padding: 0.75rem 1rem; text-decoration: none; color: var(--primary);">
							<i class="fas fa-edit"></i> Modifica
						</a>
						<!-- Elimina -->
						<form method="post" style="margin: 0;" onsubmit="return confirm('Eliminare questo budget?');"
							th:action="@{'/' + ${username} + '/account/' + ${account.id} + '/delete-budget/' + ${b.id}}">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<button type="submit"
								style="background: none; border: none; padding: 0.75rem 1rem; width: 100%; text-align: left; cursor: pointer; color: red;">
								<i class="fas fa-trash-alt"></i> Elimina
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>

</html>
