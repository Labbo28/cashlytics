<!-- edit-transaction.html - Aggiornato con campo Merchant -->
<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- Font import from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Modifica Transazione</title>
</head>

<body>
    <div th:replace="~{fragments.html :: siteHeader}"></div>

    <main class="container" style="padding: 2rem;">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <a class="btn btn-secondary" style="margin-bottom: 2rem;"
            th:href="@{'/' + ${username} + '/account/' + ${account.id}}">
            <i class="fas fa-arrow-left"></i> Torna indietro</a>
        <h1 style="margin-bottom: 2rem;">Modifica Transazione</h1>
        </div>

        <div id="addTransactionForm" style="margin-bottom: 2rem;">
            <div class="auth-container" style="margin: 0; max-width: 100%;">
                <form th:object="${transactionDTO}" method="post"
                    th:action="@{'/' + ${username} + '/account/' + ${account.id} + '/edit-transaction/' + ${transaction.id}}">

                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <!-- Importo: positivo o negativo -->
                    <div class="form-group">
                        <label for="amount">Importo (positivo o negativo)</label>
                        <input type="number" step="0.01" id="amount" th:field="*{amount}" placeholder="0.00" required />
                        <span class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
                    </div>

                    <!-- Data -->
                    <div class="form-group">
                        <label for="date">Data di Effettuazione</label>
                        <input type="date" id="date" th:field="*{date}">
                        <span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
                    </div>

                    <!-- Recurrence pattern -->
                    <div class="form-group">
                        <label for="recurrencePattern">Ricorrenza (facoltativa)</label>
                        <select id="recurrencePattern" th:field="*{recurrencePattern}"
                            style="width: 100%; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); font-size: 1rem;">
                            <option value="">Seleziona la ricorrenza della transazione</option>
                            <option th:each="p : ${T(it.uniroma3.cashlytics.Model.Enums.RecurrencePattern).values()}"
                                th:if="${p.name() != 'UNA_TANTUM'}" th:value="${p}" th:text="${p}"></option>
                        </select>
                    </div>

                    <!-- Merchant -->
                    <div class="form-group">
                        <label for="merchantId">Esercente (facoltativo)</label>
                        <select id="merchantId" th:field="*{merchantId}"
                            style="width: 100%; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); font-size: 1rem;"
                            onchange="handleMerchantSelection(this.value)">
                            <option value="">Seleziona esercente</option>
                            <option th:each="merchant : ${merchants}" th:value="${merchant.id}"
                                th:text="${merchant.name}"></option>
                            <option value="add_new">+ Aggiungi nuovo esercente</option>
                        </select>
                        <!--span class="error" th:if="${#fields.hasErrors('merchantId')}" th:errors="*{merchantId}"></span-->
                    </div>

                    <!-- Form per nuovo merchant (nascosto di default) -->
                    <div th:replace="~{fragments.html :: newMerchantForm}"></div>

                    <!-- Categoria -->
                    <div class="form-group">
                        <label for="categoryId">Categoria (facoltativa)</label>
                        <select id="categoryId" th:field="*{categoryId}"
                            style="width: 100%; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); font-size: 1rem;"
                            onchange="handleCategorySelection(this.value)">
                            <option value="">Seleziona categoria</option>
                            <option th:each="category : ${categories}" th:value="${category.id}"
                                th:text="${category.name}"></option>
                            <option value="add_new">+ Aggiungi nuova categoria</option>
                        </select>
                    </div>

                    <!-- Form per nuova categoria (nascosto di default) -->
                    <div th:replace="~{fragments.html :: newCategoryForm}"></div>

                    <!-- Descrizione -->
                    <div class="form-group">
                        <label for="description">Descrizione (facoltativa)</label>
                        <input type="text" id="description" th:field="*{description}" />
                        <span class="error" th:if="${#fields.hasErrors('description')}"
                            th:errors="*{description}"></span>
                    </div>

                    <!-- Pulsanti -->
                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary">Modifica Transazione</button>
                        <!--button type="button" class="btn btn-secondary" onclick="toggleTransactionForm()">Annulla</button-->
                    </div>
                </form>
            </div>
        </div>
    </main>


    <div th:replace="~{fragments.html :: siteFooter}"></div>
    <script th:src="@{/js/main.js}"></script>
    <script th:if="${openAllForms}" defer>
        document.addEventListener('DOMContentLoaded', function () {
            toggleTransactionForm();
            handleCategorySelection('add_new');
            handleMerchantSelection('add_new');
        });
        document.getElementById('addTransactionForm').scrollIntoView({ behavior: 'smooth' });
    </script>
</body>

</html>
