<!-- edit-transaction.html - Aggiornato con supporto nuovo Merchant e Categoria -->
<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- Font import from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Modifica Transazione</title>
</head>

<body>
    <div th:replace="~{fragments.html :: siteHeader}"></div>

    <main class="container" style="padding: 2rem;">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <a class="btn btn-secondary" style="margin-bottom: 2rem;"
            th:href="@{'/' + ${username} + '/account/' + ${account.id}}">
            <i class="fas fa-arrow-left"></i> Torna indietro</a>
        <h1 style="margin-bottom: 2rem;">Modifica Transazione</h1>

        <div id="addTransactionForm" style="margin-bottom: 2rem;">
            <div class="auth-container" style="margin: 0; max-width: 100%;">
                <form th:object="${transactionDTO}" method="post"
                    th:action="@{'/' + ${username} + '/account/' + ${account.id} + '/edit-transaction/' + ${transaction.id}}">

                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Importo: positivo o negativo -->
                    <div class="form-group">
                        <label for="amount">Importo (positivo o negativo)</label>
                        <input type="number" step="0.01" id="amount" th:field="*{amount}" placeholder="0.00" required />
                        <span class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
                    </div>

                    <!-- Data -->
                    <div class="form-group">
                        <label for="date">Data di Effettuazione</label>
                        <input type="date" id="date" th:field="*{date}">
                        <span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
                    </div>

                    <!-- Ricorrenza -->
                    <div class="form-group">
                        <label for="recurrencePattern">Ricorrenza (facoltativa)</label>
                        <select id="recurrencePattern" th:field="*{recurrencePattern}"
                            style="width: 100%; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); font-size: 1rem;">
                            <option value="">Seleziona la ricorrenza della transazione</option>
                            <option th:each="p : ${T(it.uniroma3.cashlytics.Model.Enums.RecurrencePattern).values()}"
                                th:if="${p.name() != 'UNA_TANTUM'}" th:value="${p}" th:text="${p}"></option>
                        </select>
                    </div>

                    <!-- Merchant -->
                    <div class="form-group">
                        <label for="merchantId">Esercente (facoltativo)</label>
                        <select id="merchantId" th:field="*{merchantId}"
                            style="width: 100%; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); font-size: 1rem;"
                            onchange="handleMerchantSelection(this)">
                            <option value="">Rimuovi esercente</option>
                            <option th:each="merchant : ${merchants}" th:value="${merchant.id}"
                                th:text="${merchant.name}"></option>
                            <option data-add-new="true" value="">+ Aggiungi nuovo esercente</option>
                        </select>
                    </div>

                    <!-- Form per nuovo merchant (nascosto di default) -->
                    <div id="newMerchantForm" th:replace="~{fragments.html :: newMerchantForm}" style="display:none;">
                    </div>

                    <!-- Categoria -->
                    <div class="form-group">
                        <label for="categoryId">Categoria (viene usata per aggiornare il
                            budget)<!--span style="color: red;">*</span-->
                        </label>
                        <select id="categoryId" th:field="*{categoryId}"
                            style="width: 100%; padding: 1rem; border: 1px solid var(--neutral-mid); border-radius: var(--radius-md); font-size: 1rem;"
                            required>
                            <option value="">Seleziona categoria</option>

                            <!-- Itera attraverso tutte le categorie principali -->
                            <optgroup th:each="category : ${categories}" th:if="${category.parentCategory == null}"
                                th:label="${category.name}">
                                <!-- Categoria principale -->
                                <option th:value="${category.id}" th:text="${category.name}"></option>
                                <!-- Sottocategorie se presenti -->
                                <option th:each="subcat : ${category.subCategories}" th:value="${subcat.id}"
                                    th:text="${'  └─ ' + subcat.name}"></option>
                            </optgroup>
                        </select>
                        <span class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
                        <p style="margin-top: 0.5rem; font-size: 0.9rem; color: var(--neutral-dark);">
                            <i class="fas fa-info-circle"></i>
                            <a th:href="@{'/' + ${username} + '/categories'}"
                                style="color: var(--primary); text-decoration: none;">
                                Gestisci le tue categorie
                            </a>
                        </p>
                    </div>

                    <!-- Form per nuova categoria
                    <div id="newCategoryForm" th:replace="~{fragments.html :: newCategoryForm}" style="display:none;"></div-->
                    <!-- Descrizione -->
                    <div class="form-group">
                        <label for="description">Descrizione (facoltativa)</label>
                        <input type="text" id="description" th:field="*{description}" />
                        <span class="error" th:if="${#fields.hasErrors('description')}"
                            th:errors="*{description}"></span>
                    </div>

                    <!-- Pulsanti -->
                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary">Modifica Transazione</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments.html :: siteFooter}"></div>
    <script th:src="@{/js/main.js}"></script>

    <!-- Script inline per mostrare/nascondere form addizionali -->
    <script>
        function handleMerchantSelection(selectElement) {
            const opt = selectElement.options[selectElement.selectedIndex];
            document.getElementById('newMerchantForm').style.display = opt.getAttribute('data-add-new') === 'true' ? 'block' : 'none';
        }
        function handleCategorySelection(selectElement) {
            const opt = selectElement.options[selectElement.selectedIndex];
            document.getElementById('newCategoryForm').style.display = opt.getAttribute('data-add-new') === 'true' ? 'block' : 'none';
        }
        document.addEventListener('DOMContentLoaded', function () {
            handleMerchantSelection(document.getElementById('merchantId'));
            handleCategorySelection(document.getElementById('categoryId'));
        });
    </script>
</body>

</html>
